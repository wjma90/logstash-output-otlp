input {
  http {
    port => 8080
    codec => json
  }
}

output {
  otlp {
    id => "queue_test"
    endpoint => "${OTLP_ENDPOINT:http://collector:4318/v1/logs}"
    protocol => "http"
    max_queue_size => 32
    max_batch_size => 1
    schedule_delay_millis => 1000
    connect_timeout => 120
    timeout => 120
    export_timeout_millis => 120000
    resource => { "service.name" => "queue-test" }
    attributes => { "record_id" => "record_id" }
  }
}
