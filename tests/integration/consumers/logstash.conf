input {
  http {
    port => 8080
    codec => json
  }
}

output {
  otlp {
    id => "consumers_test"
    endpoint => "${OTLP_ENDPOINT:http://collector:4318/v1/logs}"
    protocol => "${OTLP_PROTOCOL:http}"
    queue_size => "${QUEUE_SIZE:16384}"
    num_consumers => "${NUM_CONSUMERS:1}"
    max_batch_size => "${MAX_BATCH_SIZE:512}"
    schedule_delay_millis => "${SCHEDULE_DELAY_MILLIS:100}"
    connect_timeout => 5
    timeout => "${OTLP_TIMEOUT:10}"
    resource => { "service.name" => "otlp-consumers-test" }
    attributes => {
      "record_id" => "record_id"
      "run_id" => "run_id"
      "source_time_unix_nano" => "source_time_unix_nano"
    }
  }
}
