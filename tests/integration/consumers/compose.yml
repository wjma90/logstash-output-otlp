name: otlp-consumers-demo

services:
  logstash:
    stop_grace_period: 2m
    build:
      context: ../../..
      dockerfile: tests/integration/Dockerfile
    environment:
      LS_JAVA_OPTS: ${LS_JAVA_OPTS:--Xms256m -Xmx512m}
      XPACK_MONITORING_ENABLED: "false"
      NUM_CONSUMERS: ${NUM_CONSUMERS:-1}
      QUEUE_SIZE: ${QUEUE_SIZE:-16384}
      BLOCK_ON_OVERFLOW: ${BLOCK_ON_OVERFLOW:-false}
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-512}
      SCHEDULE_DELAY_MILLIS: ${SCHEDULE_DELAY_MILLIS:-100}
      OTLP_TIMEOUT: ${OTLP_TIMEOUT:-10}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-http://collector:4318/v1/logs}
      OTLP_PROTOCOL: ${OTLP_PROTOCOL:-http}
    ports:
      - "127.0.0.1:20600:9600"
      - "127.0.0.1:18082:8080"
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    command: ["--pipeline.workers", "4", "--pipeline.ecs_compatibility", "disabled", "--log.level", "info"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9600/_node/stats/pipelines/main | grep -q '\"events\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      - collector

  collector:
    image: otel/opentelemetry-collector-contrib:0.131.0
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "127.0.0.1:19888:8888"
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro

  exporter:
    image: quay.io/prometheuscommunity/json-exporter:v0.7.0
    command: ["--config.file=/config.yml"]
    ports:
      - "127.0.0.1:18979:7979"
    volumes:
      - ./exporter.yml:/config.yml:ro
    depends_on:
      logstash:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2h"]
    ports:
      - "127.0.0.1:20090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - exporter
