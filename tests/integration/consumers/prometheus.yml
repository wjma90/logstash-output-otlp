global:
  scrape_interval: 2s

scrape_configs:
  - job_name: logstash
    metrics_path: /probe
    params:
      module: [logstash]
    static_configs:
      - targets:
          - http://logstash:9600/_node/stats
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: exporter:7979
  - job_name: collector
    static_configs:
      - targets: ["collector:8888"]
