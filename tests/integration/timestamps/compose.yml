name: otlp-timestamp-demo

services:
  logstash:
    build:
      context: ../../..
      dockerfile: tests/integration/Dockerfile
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx512m
      XPACK_MONITORING_ENABLED: "false"
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    command: ["--pipeline.workers", "4", "--pipeline.ecs_compatibility", "disabled", "--log.level", "info"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://loki:3100/ready > /dev/null && curl -fsS http://localhost:9600/_node/stats/pipelines/main | grep -q '\"events\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      - collector

  collector:
    image: otel/opentelemetry-collector-contrib:0.131.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - loki

  loki:
    image: grafana/loki:3.6.3
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "127.0.0.1:13100:3100"
    volumes:
      - ../../../config/loki/loki.yaml:/etc/loki/config.yaml:ro

  generator:
    image: python:3.12-alpine
    profiles: [manual]
    volumes:
      - ./generate.py:/generate.py:ro
    command: ["python", "/generate.py"]
    depends_on:
      logstash:
        condition: service_healthy
