input {
  tcp {
    port => 9700
    codec => json_lines
  }
}

output {
  otlp {
    id => "consumers_test"
    endpoint => "${OTLP_ENDPOINT:http://collector:4317}"
    protocol => "grpc"
    queue_size => "${QUEUE_SIZE:2048}"
    block_on_overflow => "${BLOCK_ON_OVERFLOW:true}"
    num_consumers => "${NUM_CONSUMERS:2}"
    max_batch_size => "${MAX_BATCH_SIZE:256}"
    schedule_delay_millis => "${SCHEDULE_DELAY_MILLIS:100}"
    connect_timeout => 5
    timeout => "${OTLP_TIMEOUT:60}"
    resource => { "service.name" => "spring-tcp-test" }
    attributes => {
      "record_id" => "record_id"
      "run_id" => "run_id"
    }
  }
}

