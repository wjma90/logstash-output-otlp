input {
  http {
    port => 8080
    codec => json
  }
}

output {
  otlp {
    id => "tls_test"
    endpoint => "${OTLP_ENDPOINT}"
    protocol => "${OTLP_PROTOCOL}"
    ssl_certificate_authorities => "${OTLP_CA}"
    ssl_disable_tls_verification => "${TLS_SKIP_VERIFY}"
    connect_timeout => 2
    timeout => 3
    queue_size => 64
    num_consumers => 2
    max_batch_size => 16
    schedule_delay_millis => 50
    block_on_overflow => true
  }
}
