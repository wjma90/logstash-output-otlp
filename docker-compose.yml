services:
  logstash:
    build: .
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx512m
    depends_on:
      otel:
        condition: service_started
    volumes:
      - ./config/logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./config/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./config/logstash/config/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
  otel:
    image: otel/opentelemetry-collector-contrib:0.131.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./config/otel/otel.yaml:/etc/otel/config.yaml:ro
